<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Über Shimly Quiz (Third Party)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0b0a;
        --fg: #f2ede2;
        --muted: #9a917f;
        --accent: #f2c44e;
        --accent-2: #c8901b;
        --line: rgba(255, 255, 255, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: radial-gradient(120% 90% at 50% 0%, #241d10 0%, var(--bg) 58%);
        color: var(--fg);
        font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      header {
        padding: 26px 24px 20px;
        text-align: center;
      }
      .mark {
        width: 68px;
        height: 68px;
        margin-bottom: 14px;
        filter: drop-shadow(0 10px 24px rgba(242, 196, 78, 0.26));
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .version {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 0 24px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }

      dl {
        margin: 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      dl div {
        display: flex;
        gap: 14px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      dt {
        flex: none;
        width: 116px;
        color: var(--muted);
      }
      dd {
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }
      dd.mono {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
      }

      .disclaimer {
        margin: 16px 0 4px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
      }

      footer {
        display: flex;
        gap: 10px;
        justify-content: center;
        padding: 16px 24px;
        border-top: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.22);
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #14110a;
        font-weight: 600;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img class="mark" src="icon.png" alt="" aria-hidden="true" />
      <h1 id="name"></h1>
      <p class="version"><span data-t="version"></span> <span id="version"></span></p>
    </header>

    <main>
      <dl>
        <div><dt data-t="electron"></dt><dd id="electron"></dd></div>
        <div><dt data-t="chrome"></dt><dd id="chrome"></dd></div>
        <div><dt data-t="node"></dt><dd id="node"></dd></div>
        <div><dt data-t="platform"></dt><dd id="platform"></dd></div>
        <div><dt data-t="url"></dt><dd id="url" class="mono"></dd></div>
        <div><dt data-t="hosts"></dt><dd id="hosts" class="mono"></dd></div>
      </dl>
      <p class="disclaimer" data-t="disclaimer"></p>
    </main>

    <footer>
      <button class="primary" type="button" id="repo" data-t="repo"></button>
      <button type="button" id="close" data-t="close"></button>
    </footer>

    <script>
      const api = window.aboutApi;
      const t = api.t.about;

      document.documentElement.lang = api.t.lang;
      for (const el of document.querySelectorAll("[data-t]")) {
        el.textContent = t[el.dataset.t];
      }

      // Werte stehen schon beim ersten Rendern fest, nichts springt nach.
      for (const [key, value] of Object.entries(api.info)) {
        const el = document.getElementById(key);
        if (el) el.textContent = value;
      }

      document.getElementById("repo").addEventListener("click", () => api.openRepo());
      document.getElementById("close").addEventListener("click", () => api.close());

      addEventListener("keydown", (event) => {
        if (event.key === "Escape") api.close();
      });
    </script>
  </body>
</html>

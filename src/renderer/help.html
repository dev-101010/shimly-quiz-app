<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Hilfe — Shimly Quiz (Third Party)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0b0a;
        --fg: #f2ede2;
        --muted: #9a917f;
        --accent: #f2c44e;
        --accent-2: #c8901b;
        --line: rgba(255, 255, 255, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: radial-gradient(120% 90% at 50% 0%, #241d10 0%, var(--bg) 58%);
        color: var(--fg);
        font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--line);
      }
      header svg {
        color: var(--accent);
        flex: none;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 6px 22px 20px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }

      h2 {
        margin: 22px 0 10px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Tastenkürzel */
      .keys {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px 18px;
        align-items: baseline;
      }
      /* Jede Taste ein eigenes Feld – der Abstand entsteht durch die Lücke,
         nicht durch Zeichen in der Beschriftung. */
      .combo {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .sep {
        font-style: normal;
        font-size: 12px;
        color: var(--muted);
      }
      kbd {
        padding: 3px 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-bottom-width: 2px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        white-space: nowrap;
        color: var(--fg);
      }
      .keys span {
        color: var(--muted);
        font-size: 13px;
      }

      /* Hinweise */
      .note {
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }
      .note:last-child {
        border-bottom: none;
      }
      .note b {
        display: block;
        font-weight: 600;
      }
      .note p {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      footer {
        display: flex;
        justify-content: flex-end;
        padding: 14px 22px;
        border-top: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.22);
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
      <h1 data-t="title"></h1>
    </header>

    <main>
      <h2 data-t="shortcutsHeading"></h2>
      <div class="keys" id="keys"></div>

      <h2 data-t="notesHeading"></h2>
      <div id="notes"></div>
    </main>

    <footer>
      <button type="button" id="close" data-t="close"></button>
    </footer>

    <script>
      const api = window.helpApi;
      const t = api.t.help;

      document.documentElement.lang = api.t.lang;
      for (const el of document.querySelectorAll("[data-t]")) {
        el.textContent = t[el.dataset.t];
      }

      // Kürzel kommen fertig aus dem Hauptprozess – sie hängen von der
      // Plattform ab und stehen deshalb nicht im Markup.
      const keys = document.getElementById("keys");

      function separator(sign) {
        const el = document.createElement("i");
        el.className = "sep";
        el.textContent = sign;
        return el;
      }

      for (const row of api.shortcuts) {
        const combo = document.createElement("div");
        combo.className = "combo";

        row.groups.forEach((group, groupIndex) => {
          // Mehrere Gruppen sind gleichwertige Alternativen.
          if (groupIndex > 0) combo.append(separator("/"));
          group.forEach((key, keyIndex) => {
            if (keyIndex > 0) combo.append(separator("+"));
            const kbd = document.createElement("kbd");
            kbd.textContent = key;
            combo.append(kbd);
          });
        });

        const text = document.createElement("span");
        text.textContent = row.text;
        keys.append(combo, text);
      }

      const notes = document.getElementById("notes");
      for (const name of ["Links", "Login", "Cache", "Offline", "Unsigned"]) {
        const box = document.createElement("div");
        box.className = "note";
        const title = document.createElement("b");
        title.textContent = t["note" + name + "Title"];
        const body = document.createElement("p");
        body.textContent = t["note" + name];
        box.append(title, body);
        notes.append(box);
      }

      document.getElementById("close").addEventListener("click", () => api.close());
      addEventListener("keydown", (event) => {
        if (event.key === "Escape") api.close();
      });
    </script>
  </body>
</html>

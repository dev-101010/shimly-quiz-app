<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Shimly Quiz (Third Party)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0b0a;
        --fg: #f2ede2;
        --muted: #9a917f;
        --accent: #f2c44e;
        --accent-2: #c8901b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #241d10 0%, var(--bg) 62%);
        color: var(--fg);
        font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      main {
        width: min(440px, 88vw);
        text-align: center;
        padding: 8px;
      }
      .mark {
        display: block;
        width: 84px;
        height: 84px;
        margin: 0 auto 22px;
        filter: drop-shadow(0 10px 26px rgba(242, 196, 78, 0.28));
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      code {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        color: #7d7462;
      }
      .bar {
        width: 180px;
        height: 3px;
        margin: 26px auto 0;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .actions {
        margin-top: 26px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      button {
        font: inherit;
        padding: 9px 20px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #14110a;
        font-weight: 600;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="logo.png" alt="" aria-hidden="true" />

      <section id="loading">
        <h1 data-t="loadingTitle"></h1>
        <p data-t="loadingText"></p>
        <div class="bar"></div>
      </section>

      <section id="error" hidden>
        <h1 data-t="errorTitle"></h1>
        <p id="detail" data-t="errorText"></p>
        <p style="margin-top: 6px"><code id="code"></code></p>
        <div class="actions">
          <button class="primary" id="retry" type="button" data-t="retry"></button>
          <button id="quit" type="button" data-t="quit"></button>
        </div>
      </section>
    </main>

    <script>
      const t = window.shimlyApp.t.splash;
      document.documentElement.lang = window.shimlyApp.t.lang;
      for (const el of document.querySelectorAll("[data-t]")) {
        el.textContent = t[el.dataset.t];
      }

      const params = new URLSearchParams(location.search);
      const isError = params.get("state") === "error";

      document.getElementById("loading").hidden = isError;
      document.getElementById("error").hidden = !isError;

      if (isError) {
        const message = params.get("message");
        if (message) document.getElementById("detail").textContent = message;
        document.getElementById("code").textContent = t.errorCode + " " + params.get("code");

        document.getElementById("retry").addEventListener("click", () => window.shimlyApp.retry());
        document.getElementById("quit").addEventListener("click", () => window.shimlyApp.quit());
        document.getElementById("retry").focus();

        addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === "F5") window.shimlyApp.retry();
        });
      }
    </script>
  </body>
</html>

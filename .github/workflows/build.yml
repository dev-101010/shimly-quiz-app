name: Build

# Manuell über den Actions-Tab oder automatisch beim Pushen eines Tags (v1.0.0).
# Absichtlich nicht bei jedem Push – ein Lauf kostet auf drei Plattformen
# spürbar Minuten.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # nötig, damit der release-Job Dateien anhängen darf

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # eine kaputte Plattform soll die anderen nicht abbrechen
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            artifacts: |
              dist/*.exe
              dist/*.blockmap
          - name: Linux
            os: ubuntu-latest
            target: --linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - name: macOS
            os: macos-latest
            target: --mac
            artifacts: |
              dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true # erst prüfen, dann selbst veröffentlichen
          generate_release_notes: true
